<meta charset="utf-8">
<style>
  /* QuickLook lays this out in a 1024px viewport and scales the thumbnail up to
     1280, so the page is authored at 1024 and every size is chosen for that.
     It also runs no JavaScript and loads no web fonts: the meter below is static
     markup and the system face is the design, not a fallback.

     The card fills the whole square with its content vertically centred, so the
     centred crop to 1280x640 lands on the content however the page is laid out. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:1024px;overflow:hidden}
  .card{
    width:1024px;height:1024px;
    background:
      radial-gradient(600px 420px at 76% 50%, rgba(59,158,234,.18), transparent 62%),
      linear-gradient(150deg,#111C21 0%,#0F1518 55%,#0B1013 100%);
    color:#DCE6EA;
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .inner{width:904px;display:flex;align-items:center;justify-content:space-between;gap:36px}

  .top{display:flex;align-items:center;gap:18px;margin-bottom:20px}
  h1{font-size:70px;line-height:.9;letter-spacing:-.03em;font-weight:700;color:#F2F8FC}
  .sub{font-size:22px;line-height:1.36;color:#A9BDC6}
  .sub b{color:#F2F8FC;font-weight:600}
  .tags{display:flex;gap:8px;margin-top:22px}
  .tag{
    font-size:11px;letter-spacing:.15em;font-weight:600;color:#93AAB3;
    border:1px solid #2F3E45;border-radius:999px;padding:5px 13px;
    background:rgba(24,33,38,.72);
  }
  .flow{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;line-height:2.0;color:#6E838C;white-space:pre;flex:0 0 auto;
  }
  .flow .k{color:#3B9EEA}
  .flow .g{color:#46B87A}
  .meter{display:flex;align-items:flex-end;gap:4px;height:42px;margin-top:28px;width:430px;opacity:.55}
  .meter i{flex:1;background:#3B9EEA;border-radius:2px}
</style>

          <rect x="21" y="30" width="6.5" height="21" rx="3.25"/>
